    <script>
      /* 무엇: 프로필·UI 이미지 URL을 lh3 임베드로 통일 / 왜: drive uc→usercontent 리다이렉트는 CORP 등으로 로컬에서 img가 깨질 수 있음 */
      (function () {
        var DEFAULT_DRIVE =
          "./image/cache/12JEeAGf9eRkYAyIIRxDZDW3ugiwf-Kk8.png";
        function lh3FromId(id) {
          if (!id) return DEFAULT_DRIVE;
          return "https://lh3.googleusercontent.com/d/" + id + "=w2000";
        }
        function toDriveViewUrl(u) {
          if (!u || typeof u !== "string") return DEFAULT_DRIVE;
          if (u.indexOf("data:") === 0) return u;
          var baseClean = u.split("#")[0].split("&_bxcb=")[0];
          if (baseClean.indexOf("lh3.googleusercontent.com/d/") >= 0) return baseClean;
          if (baseClean.indexOf("drive.google.com/uc") >= 0 && baseClean.indexOf("id=") >= 0) {
            var idFromUc = baseClean.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (idFromUc) return lh3FromId(idFromUc[1]);
          }
          if (u.indexOf("drive.google.com") === -1) return u;
          var id = null;
          var m = u.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
          if (m) id = m[1];
          if (!id) {
            m = u.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (m) id = m[1];
          }
          if (!id) return baseClean;
          return lh3FromId(id);
        }
        function wireImgFallback(img) {
          if (!img || img.tagName !== "IMG" || img.dataset.bxWired === "1") return;
          var s = img.getAttribute("src") || "";
          if (
            s.indexOf("drive.google.com") === -1 &&
            s.indexOf("lh3.googleusercontent.com") === -1 &&
            s.indexOf("/file/d/") === -1
          )
            return;
          img.dataset.bxWired = "1";
          var fixed = toDriveViewUrl(s);
          if (fixed !== s) img.setAttribute("src", fixed);
          img.setAttribute("referrerpolicy", "no-referrer");
          img.addEventListener("error", function onBxImgErr() {
            if (img.dataset.bxImgErr === "1") {
              img.removeAttribute("src");
              img.classList.add("bx-img-fallback");
              img.removeAttribute("alt");
              img.removeEventListener("error", onBxImgErr);
              return;
            }
            img.dataset.bxImgErr = "1";
            if (img.hasAttribute("crossorigin")) img.removeAttribute("crossorigin");
            var u = toDriveViewUrl(img.getAttribute("src") || "");
            var base = u.split("&_bxcb=")[0].split("#")[0];
            /* 무엇: lh3 URL은 쿼리 붙이면 404가 날 수 있어 해시로만 캐시 무력화 / 왜: 재시도 시에도 이미지가 뜨게 함 */
            img.src = base + "#bxcb=" + Date.now();
          });
        }
        function scan() {
          document.querySelectorAll("img").forEach(wireImgFallback);
        }
        window.bxNormalizeDriveImageUrl = toDriveViewUrl;
        window.bxWireDriveImageFallbacks = scan;
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", scan);
        } else {
          scan();
        }
      })();
    </script>

          </div>
          <div style="position:absolute;bottom:0;left:0;width:100%;height:70%;z-index:1;pointer-events:none;">
            <img crossorigin="anonymous" referrerpolicy="no-referrer" src="./image/cache/19ZNW9ic3jcD0cefm9UWToxY_kyxJG8N0.png" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center top;" />
          </div>
          <button onclick="closeDrawer()" style="position:absolute;top:20px;right:20px;border:none;background:transparent;font-size:40px;font-weight:300;color:#000;cursor:pointer;z-index:100;">&times;</button>
        </div>`;
      }

      function afterOverlay() {
        const rawProfile =
          localStorage.getItem("boxer_profile_image") ||
          "./image/cache/1fBykG25zJ2YkJFqY2exc-Lraz0Zzcr18.png";
        const profileImg =
          typeof window.bxNormalizeDriveImageUrl === "function"
            ? window.bxNormalizeDriveImageUrl(rawProfile)
            : rawProfile;
        const graphImg =
          typeof window.bxNormalizeDriveImageUrl === "function"
            ? window.bxNormalizeDriveImageUrl(
                "./image/cache/1E58-Ar9HJovqNrhjRTCRZ5bArTU8Q1Hg.png"
              )
            : "./image/cache/1E58-Ar9HJovqNrhjRTCRZ5bArTU8Q1Hg.png";
        const cachedUser = typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() : null;
        const nickname   = cachedUser?.username || "User NickName님";
        return `<section class="drawer-profile"><img referrerpolicy="no-referrer" src="${profileImg}" alt="프로필" /><div><p style="margin:0;font-size:25px;line-height:1.2;">${nickname}</p><p style="margin:18px 0 0;font-size:25px;line-height:1.2;">오늘도 트레이닝 해요!</p><div class="drawer-links" style="margin-top:16px;"><button type="button" class="drawer-action-btn" onclick="openProfileModal()">프로필 수정</button><button type="button" class="drawer-action-btn" onclick="performLogout()">로그아웃</button></div></div></section><section class="stat-box"><div class="stat-grid"><div class="stat-cell"><p class="stat-label">최고 점수</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">점</p></div></div><div class="stat-cell"><p class="stat-label">최고 콤보</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">콤보</p></div></div><div class="stat-cell"><p class="stat-label">회피율</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">%</p></div></div><div class="stat-cell"><p class="stat-label">총 운동 횟수</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">회</p></div></div></div></section><section class="graph-box"><h4>최근 회피율 그래프</h4><img referrerpolicy="no-referrer" src="${graphImg}" alt="회피율 그래프" /></section>`;
      }

      function userHasAdminAccess(user) {
        if (!user || typeof user !== "object") return false;
        const tier = String(user.tier || "").toLowerCase();
        const role = String(user.role || "").toLowerCase();
        return tier === "admin" || role === "admin" || role === "superadmin" || user.is_admin === true || user.is_superuser === true;
      }

      function getCachedAuthUser() {
        return typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() : null;
      }

      function getDisplayNickname() {
        const cachedUser = getCachedAuthUser();
        const rawName    = (cachedUser?.username || "").trim();
        if (!rawName) return null;
        return rawName.endsWith("님") ? rawName : `${rawName}님`;
      }

      function syncLoginState() {
        const tokenBased = typeof auth !== "undefined" && typeof auth.isLoggedIn === "function"
          ? auth.isLoggedIn() : false;
        isLoggedIn = isLoggedIn || tokenBased;
        return isLoggedIn;
      }

      function render() {
        const loggedIn = syncLoginState();
        const cachedUser = getCachedAuthUser();
        const nickname = getDisplayNickname();
        if (loggedIn) {
          userLabel.textContent = nickname || "내 계정";
          userLabel.style.color = "#ED1D32";
        } else {
          userLabel.textContent = "로그인";
          userLabel.style.color = "";
        }
        if (adminModeLink) adminModeLink.hidden = !(loggedIn && userHasAdminAccess(cachedUser));
        drawerInner.innerHTML = loggedIn ? afterOverlay() : beforeOverlay();
        if (typeof window.bxWireDriveImageFallbacks === "function") {
          window.bxWireDriveImageFallbacks();
        }
      }

      async function initAuthState() {
        if (typeof auth === "undefined") { isLoggedIn = false; render(); return; }
        if (typeof auth.handlePageLoadSessionCheck === "function" && !auth.handlePageLoadSessionCheck()) {
          isLoggedIn = false; render(); return;
        }
        if (typeof auth.validateSession === "function") {
          try { isLoggedIn = await auth.validateSession(); } catch { isLoggedIn = false; }
        } else if (typeof auth.isLoggedIn === "function") {
          isLoggedIn = auth.isLoggedIn();
        } else {
          isLoggedIn = false;
        }
        if (isLoggedIn && typeof auth.fetchCurrentUser === "function") {
          try { await auth.fetchCurrentUser(); } catch {}
        }
        render();
      }

      function openDrawer()  {
        if (isLoggedIn) {
          window.location.href = "mypage.html";
          return;
        }
        isDrawerOpen = true;
        document.body.classList.add("drawer-open");
        drawer.setAttribute("aria-hidden", "false");
      }
      function closeDrawer() { isDrawerOpen = false; document.body.classList.remove("drawer-open"); drawer.setAttribute("aria-hidden", "true"); }

      function openAuthModal(tab = "login") { document.getElementById("authModal").classList.add("open"); switchAuthTab(tab); }
      function closeAuthModal()             { document.getElementById("authModal").classList.remove("open"); }
      function closeAuthModalOnOverlay(e)   { if (e.target.id === "authModal") closeAuthModal(); }

      function openProfileModal() {
        const user = typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() : null;
        const rawImg = localStorage.getItem("boxer_profile_image") || "./image/cache/1fBykG25zJ2YkJFqY2exc-Lraz0Zzcr18.png";
        const img =
          typeof window.bxNormalizeDriveImageUrl === "function"
            ? window.bxNormalizeDriveImageUrl(rawImg)
            : rawImg;
        document.getElementById("profileName").value     = user?.name || "";
        document.getElementById("profilePhone").value    = user?.phone || "";
        document.getElementById("profileNickname").value = user?.username || "";
        document.getElementById("profilePassword").value = "";
        document.getElementById("profileError").style.display = "none";
        profilePreview.src = img;
        document.getElementById("profileModal").classList.add("open");
      }
      function closeProfileModal()           { document.getElementById("profileModal").classList.remove("open"); }
      function closeProfileModalOnOverlay(e) { if (e.target.id === "profileModal") closeProfileModal(); }

      async function handleProfileSave(e) {
        e.preventDefault();
        const err = document.getElementById("profileError"); err.style.display = "none";
        try {
          const cu = typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() || {} : {};
          const mu = {
            ...cu,
            name:     document.getElementById("profileName").value.trim(),
            phone:    document.getElementById("profilePhone").value.trim(),
            username: document.getElementById("profileNickname").value.trim() || cu.username
          };
          localStorage.setItem("boxer_user", JSON.stringify(mu));
          closeProfileModal(); render();
        } catch (ex) {
          err.textContent = ex.message || "프로필 저장에 실패했습니다.";
          err.style.display = "block";
        }
      }

      function performLogout() {
        if (typeof auth !== "undefined" && typeof auth.logout === "function") {
          auth.logout({ redirect: false }); isLoggedIn = false; closeDrawer(); render(); return;
        }
        ["boxer_token","boxer_user","boxer_logged_in","boxer_last_activity"].forEach(k => localStorage.removeItem(k));
        isLoggedIn = false; closeDrawer(); render();
      }

      function switchAuthTab(tab) {
        document.getElementById("tabLogin").setAttribute("aria-selected",  tab === "login"  ? "true" : "false");
        document.getElementById("tabSignup").setAttribute("aria-selected", tab === "signup" ? "true" : "false");
        document.getElementById("paneLogin").classList.toggle("active",  tab === "login");
        document.getElementById("paneSignup").classList.toggle("active", tab === "signup");
        const le = document.getElementById("loginError");
        const se = document.getElementById("signupError");
        if (le) le.style.display = "none";
        if (se) se.style.display = "none";
      }

      function showAuthNotReady(e) { e.preventDefault(); alert("해당 기능은 준비 중입니다."); return false; }

      async function handleLogin(e) {
        e.preventDefault();
        const err = document.getElementById("loginError"); err.style.display = "none";
        if (typeof auth === "undefined") { err.textContent = "인증 모듈을 불러오지 못했습니다."; err.style.display = "block"; return; }
        try {
          let user = await auth.login(
            document.getElementById("loginEmail").value.trim(),
            document.getElementById("loginPassword").value
          );
          if (!user && typeof auth.fetchCurrentUser === "function") user = await auth.fetchCurrentUser();
          isLoggedIn = !!((typeof auth.isLoggedIn === "function" && auth.isLoggedIn()) || user);
          closeAuthModal(); closeDrawer(); render();
        } catch (ex) { err.textContent = ex.message || "로그인에 실패했습니다."; err.style.display = "block"; }
      }

      async function handleSignup(e) {
        e.preventDefault();
        const err = document.getElementById("signupError"); err.style.display = "none";
        if (typeof auth === "undefined") { err.textContent = "인증 모듈을 불러오지 못했습니다."; err.style.display = "block"; return; }
        try {
          const r = await auth.signup(
            document.getElementById("signupUsername").value.trim(),
            document.getElementById("signupEmail").value.trim(),
            document.getElementById("signupPassword").value
          );
          isLoggedIn = !!((typeof auth.isLoggedIn === "function" && auth.isLoggedIn()) || r?.token || r?.access_token);
          closeAuthModal(); closeDrawer(); render();
        } catch (ex) { err.textContent = ex.message || "회원가입에 실패했습니다."; err.style.display = "block"; }
      }

      /* 카드 키보드 접근성 */
      document.querySelectorAll('.s3-card').forEach(card => {
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
        });
      });

      navLoginBtn.addEventListener("click", () => {
        if (isLoggedIn) {
          window.location.href = "mypage.html";
          return;
        }
        openAuthModal("login");
      });

      profilePhotoInput.addEventListener("change", e => {
        const file = e.target.files?.[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const r = String(reader.result || "");
          localStorage.setItem("boxer_profile_image", r);
          profilePreview.src = r;
        };
        reader.readAsDataURL(file);
      });

      document.addEventListener("keydown", e => { if (e.key === "Escape" && isDrawerOpen) closeDrawer(); });
      window.addEventListener("storage", e => {
        if (["boxer_logged_in","boxer_user","boxer_auth_event"].includes(e.key)) initAuthState();
      });

      initAuthState();
    </script>

  </body>
</html>
