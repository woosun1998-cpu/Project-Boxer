<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOXER - 트레이닝</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/tutorial-new.css" />
  </head>
  <body class="tut-tutorial-page">
    <!-- 상단 내비 — index와 동일 패턴, 트레이닝 활성 -->
    <nav class="hero-nav" aria-label="메인 내비게이션">
      <a href="index.html">홈</a>
      <a href="tutorial-new.html" class="active">트레이닝</a>
      <a href="diet-boxing.html">다이어트 복싱</a>
      <a href="sparring.html">스파링</a>
      <a href="stretch.html">스트레칭</a>
      <button id="navLoginBtn" type="button" class="drawer-auth-link">
        <span id="userLabel">로그인</span>
      </button>
    </nav>

    <!-- Figma 453:24 트레이닝 페이지 -->
    <div class="tut-page-shell">
      <main class="tut-page">
      <section class="tut-hero" aria-label="트레이닝 소개">
        <!-- 빨간 평행사변형: 사용자 제공 이미지로 렌더링 -->
        <div class="tut-hero-shape" aria-hidden="true">
          <img crossorigin="anonymous" src="./image/cache/1QH3XaFWgPDjkpXbD2qo9Arbo70sLR3Y6.png" alt="" />
        </div>
        <div class="tut-hero-train-title" aria-hidden="true">
          <img crossorigin="anonymous" src="./image/cache/1TUE5jY6eCGOM_yOu8l4p6M6NziIht3ak.png" alt="" />
        </div>
        <div class="tut-hero-boxer" aria-hidden="true">
          <img src="imboxer/assets/images/tutorials/woosun-training-boxer.png" alt="트레이닝 복서" />
        </div>
        <div class="tut-hero-copy">
          <p>영상 속 트레이너의 움직임에 맞춰 신나게 펀치를 뻗어보세요.</p>
          <p>AI가 당신의 자세를 실시간으로 분석해 완벽한 폼으로 교정해 줍니다.</p>
        </div>
      </section>

      <div class="tut-strip tut-strip--top" aria-hidden="true"></div>

      <div class="tut-lower" aria-hidden="true"></div>

      <!-- 모드 버튼 + 카드: Flex로 가운데 정렬 (Figma y 기준은 섹션으로 유지) -->
      <section class="tut-cards-section" aria-label="난이도 선택">
        <button type="button" class="tut-mode-btn" aria-label="모드 선택">
          모드 선택하기
        </button>

        <div class="tut-cards-container">
          <!-- 카드 3열: 이미지 파일만(인물·버튼·문구 포함) -->
          <article
            class="tut-card level-card tut-card--beginner"
            data-level="beginner"
            role="link"
            tabindex="0"
            aria-label="초급 레벨"
          >
            <div class="tut-card-inner">
              <img crossorigin="anonymous" src="./image/cache/1GNUy58w9hQqheQSQj7Iu9n9NnV7W8ODY.png" alt="초급 레벨" />
            </div>
          </article>

          <article
            class="tut-card level-card tut-card--intermediate"
            data-level="intermediate"
            role="link"
            tabindex="0"
            aria-label="중급 레벨"
          >
            <div class="tut-card-inner">
              <img crossorigin="anonymous" src="./image/cache/1LOVkkMQdeOrdmHWfWEYwkfRzx5O2KLZS.png" alt="중급 레벨" />
            </div>
          </article>

          <article
            class="tut-card level-card tut-card--advanced"
            data-level="advanced"
            role="link"
            tabindex="0"
            aria-label="고급 레벨"
          >
            <div class="tut-card-inner">
              <img crossorigin="anonymous" src="./image/cache/1UvCXsjpI8eAGvBpXSax67cNbUNJC7mPo.png" alt="고급 레벨" />
            </div>
          </article>
        </div>
      </section>

        <div class="tut-strip tut-strip--bottom" aria-hidden="true"></div>
      </main>
    </div>

    <div id="dimLayer" class="dim" aria-hidden="true"></div>
    <aside id="drawer" class="drawer" aria-hidden="true">
      <button id="closeDrawerBtn" class="drawer-close" aria-label="메뉴 닫기">&times;</button>
      <div id="drawerInner" class="drawer-inner"></div>
    </aside>

    <div id="authModal" class="auth-modal-overlay" onclick="closeAuthModalOnOverlay(event)">
      <div class="auth-modal" role="dialog" aria-modal="true" aria-label="로그인 및 회원가입">
        <div class="auth-brand">
          <img crossorigin="anonymous" class="auth-brand__img" src="./image/cache/12JEeAGf9eRkYAyIIRxDZDW3ugiwf-Kk8.png" alt="BOXER" />
        </div>
        <div class="auth-mode" role="tablist">
          <button class="auth-mode__btn" type="button" role="tab" id="tabLogin" aria-selected="true" onclick="switchAuthTab('login')">로그인</button>
          <button class="auth-mode__btn" type="button" role="tab" id="tabSignup" aria-selected="false" onclick="switchAuthTab('signup')">회원가입</button>
        </div>
        <div class="auth-pane active" id="paneLogin">
          <p class="auth-inset-title">아이디(이메일) 로그인</p>
          <form onsubmit="handleLogin(event)">
            <div class="auth-inset">
              <div class="auth-inset__row">
                <input id="loginEmail" class="naver-inp" type="email" inputmode="email" autocomplete="username" placeholder=" " required />
                <label class="auth-float" for="loginEmail">아이디(이메일)</label>
              </div>
              <div class="auth-inset__row">
                <input id="loginPassword" class="naver-inp" type="password" autocomplete="current-password" minlength="8" placeholder=" " required />
                <label class="auth-float" for="loginPassword">비밀번호</label>
              </div>
            </div>
            <div class="auth-extras">
              <label class="auth-keep"><input type="checkbox" id="authKeepLogin" name="keep" />로그인 상태 유지</label>
            </div>
            <p id="loginError" class="auth-error"></p>
            <button class="auth-btn-main" type="submit">로그인</button>
          </form>
          <div class="auth-foot">
            <a href="#" onclick="return showAuthNotReady(event);">비밀번호 찾기</a>
            <span class="auth-foot-sep">|</span>
            <a href="#" onclick="return showAuthNotReady(event);">아이디 찾기</a>
            <span class="auth-foot-sep">|</span>
            <button type="button" class="auth-foot__btn" onclick="switchAuthTab('signup')">회원가입</button>
          </div>
        </div>
        <div class="auth-pane" id="paneSignup">
          <p class="auth-inset-title">새 계정으로 회원가입</p>
          <form onsubmit="handleSignup(event)">
            <div class="auth-inset">
              <div class="auth-inset__row">
                <input id="signupUsername" class="naver-inp" type="text" minlength="3" maxlength="20" autocomplete="nickname" placeholder=" " required />
                <label class="auth-float" for="signupUsername">닉네임 (3~20자)</label>
              </div>
              <div class="auth-inset__row">
                <input id="signupEmail" class="naver-inp" type="email" inputmode="email" autocomplete="email" placeholder=" " required />
                <label class="auth-float" for="signupEmail">아이디(이메일)</label>
              </div>
              <div class="auth-inset__row">
                <input id="signupPassword" class="naver-inp" type="password" minlength="8" autocomplete="new-password" placeholder=" " required />
                <label class="auth-float" for="signupPassword">비밀번호 (8자 이상)</label>
              </div>
            </div>
            <p id="signupError" class="auth-error"></p>
            <button class="auth-btn-main" type="submit">회원가입</button>
          </form>
          <div class="auth-foot">
            <a href="#" onclick="return showAuthNotReady(event);">비밀번호 찾기</a>
            <span class="auth-foot-sep">|</span>
            <a href="#" onclick="return showAuthNotReady(event);">아이디 찾기</a>
            <span class="auth-foot-sep">|</span>
            <button type="button" class="auth-foot__btn" onclick="switchAuthTab('login')">로그인</button>
          </div>
        </div>
      </div>
    </div>

    <div id="profileModal" class="profile-modal-overlay" onclick="closeProfileModalOnOverlay(event)">
      <div class="profile-modal" role="dialog" aria-modal="true" aria-label="프로필 수정">
        <h3 class="profile-title">프로필 수정</h3>
        <img crossorigin="anonymous" id="profilePreview" class="profile-preview" src="./image/cache/1fBykG25zJ2YkJFqY2exc-Lraz0Zzcr18.png" alt="프로필 미리보기" />
        <form onsubmit="handleProfileSave(event)">
          <div class="profile-grid">
            <div class="auth-field">
              <input id="profileName" class="auth-input" type="text" placeholder=" " />
              <label class="auth-label" for="profileName">이름</label>
            </div>
            <div class="auth-field">
              <input id="profilePhone" class="auth-input" type="tel" placeholder=" " />
              <label class="auth-label" for="profilePhone">전화번호</label>
            </div>
            <div class="auth-field">
              <input id="profileNickname" class="auth-input" type="text" placeholder=" " />
              <label class="auth-label" for="profileNickname">닉네임</label>
            </div>
            <div class="auth-field">
              <input id="profilePassword" class="auth-input" type="password" placeholder=" " />
              <label class="auth-label" for="profilePassword">비밀번호</label>
            </div>
            <div class="auth-field">
              <input id="profilePhoto" class="auth-input" type="file" accept="image/*" />
            </div>
          </div>
          <p id="profileError" class="auth-error"></p>
          <div class="profile-actions">
            <button type="button" class="btn-secondary" onclick="closeProfileModal()">취소</button>
            <button class="auth-submit" type="submit">저장</button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/core/api.js?v=8000"></script>
    <script src="js/core/auth.js?v=8000"></script>
    <script>
      let isLoggedIn = typeof auth !== "undefined" && typeof auth.isLoggedIn === "function" ? auth.isLoggedIn() : false;
      let isDrawerOpen = false;

      const closeDrawerBtn = document.getElementById("closeDrawerBtn");
      const dimLayer = document.getElementById("dimLayer");
      const drawer = document.getElementById("drawer");
      const drawerInner = document.getElementById("drawerInner");
      const userLabel = document.getElementById("userLabel");
      const navLoginBtn = document.getElementById("navLoginBtn");
      const profilePhotoInput = document.getElementById("profilePhoto");
      const profilePreview = document.getElementById("profilePreview");

      function beforeOverlay() {
        return `<div style="position:relative;width:100%;height:100%;background:#fff;overflow:hidden;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:30px;position:relative;z-index:10;">
            <img crossorigin="anonymous" src="./image/cache/12JEeAGf9eRkYAyIIRxDZDW3ugiwf-Kk8.png" alt="BOXER" style="width:80px;height:80px;object-fit:contain;" />
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:15px;">
              <div style="background:#F2F2F2;padding:10px 20px;border-radius:5px;font-size:16px;color:#666;font-weight:500;">로그인 후 이용 하실 수 있습니다.</div>
              <div style="display:flex;gap:20px;">
                <button type="button" onclick="openAuthModal('login')" style="border:none;background:transparent;font-size:20px;font-weight:800;color:#000;cursor:pointer;padding:0;">로그인</button>
                <button type="button" onclick="openAuthModal('signup')" style="border:none;background:transparent;font-size:20px;font-weight:800;color:#000;cursor:pointer;padding:0;">회원가입</button>
              </div>
            </div>
          </div>
          <div style="padding:0 40px;margin-top:50px;position:relative;z-index:5;">
            <h2 style="margin:0;font-size:72px;font-weight:900;line-height:1.1;letter-spacing:-3px;color:#000;"><span style="display:block;">집에서 쉽게</span><span style="display:block;">복싱을 즐기세요</span></h2>
          </div>
          <div style="position:absolute;bottom:0;left:0;width:100%;height:70%;z-index:1;pointer-events:none;">
            <img crossorigin="anonymous" src="./image/cache/19ZNW9ic3jcD0cefm9UWToxY_kyxJG8N0.png" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center top;" />
          </div>
          <button onclick="closeDrawer()" style="position:absolute;top:20px;right:20px;border:none;background:transparent;font-size:40px;font-weight:300;color:#000;cursor:pointer;z-index:100;">&times;</button>
        </div>`;
      }

      function afterOverlay() {
        const profileImg =
          auth.normalizeDriveProfileImageUrl(localStorage.getItem("boxer_profile_image")) ||
          "./image/cache/1fBykG25zJ2YkJFqY2exc-Lraz0Zzcr18.png";
        const cachedUser = typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() : null;
        const nickname = cachedUser?.username || "User NickName님";
        return `<section class="drawer-profile"><img crossorigin="anonymous" src="${profileImg}" alt="프로필" /><div><p style="margin:0;font-size:25px;line-height:1.2;">${nickname}</p><p style="margin:18px 0 0;font-size:25px;line-height:1.2;">오늘도 트레이닝 해요!</p><div class="drawer-links" style="margin-top:16px;"><button type="button" class="drawer-action-btn" onclick="openProfileModal()">프로필 수정</button><button type="button" class="drawer-action-btn" onclick="performLogout()">로그아웃</button></div></div></section><section class="stat-box"><div class="stat-grid"><div class="stat-cell"><p class="stat-label">최고 점수</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">점</p></div></div><div class="stat-cell"><p class="stat-label">최고 콤보</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">콤보</p></div></div><div class="stat-cell"><p class="stat-label">회피율</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">%</p></div></div><div class="stat-cell"><p class="stat-label">총 운동 횟수</p><div class="stat-number-row"><p class="stat-value">00</p><p class="stat-unit">회</p></div></div></div></section><section class="graph-box"><h4>최근 회피율 그래프</h4><img crossorigin="anonymous" src="./image/cache/1E58-Ar9HJovqNrhjRTCRZ5bArTU8Q1Hg.png" onerror="this.onerror=null;this.style.display='none'" alt="회피율 그래프" /></section>`;
      }

      function getDisplayNickname() {
        const cachedUser = typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() : null;
        const rawName = (cachedUser?.username || "").trim();
        if (!rawName) return null;
        return rawName.endsWith("님") ? rawName : `${rawName}님`;
      }

      function syncLoginState() {
        const tokenBased = typeof auth !== "undefined" && typeof auth.isLoggedIn === "function" ? auth.isLoggedIn() : false;
        isLoggedIn = isLoggedIn || tokenBased;
        return isLoggedIn;
      }

      function render() {
        const loggedIn = syncLoginState();
        const nickname = getDisplayNickname();
        if (loggedIn) {
          userLabel.textContent = nickname || "내 계정";
          userLabel.style.color = "#ED1D32";
        } else {
          userLabel.textContent = "로그인";
          userLabel.style.color = "";
        }
        drawerInner.innerHTML = loggedIn ? afterOverlay() : beforeOverlay();
      }

      async function initAuthState() {
        if (typeof auth === "undefined") {
          isLoggedIn = false;
          render();
          return;
        }
        if (typeof auth.handlePageLoadSessionCheck === "function" && !auth.handlePageLoadSessionCheck()) {
          isLoggedIn = false;
          render();
          return;
        }
        if (typeof auth.validateSession === "function") {
          try {
            isLoggedIn = await auth.validateSession();
          } catch {
            isLoggedIn = false;
          }
        } else if (typeof auth.isLoggedIn === "function") {
          isLoggedIn = auth.isLoggedIn();
        } else {
          isLoggedIn = false;
        }
        render();
      }

      function openDrawer() {
        isDrawerOpen = true;
        document.body.classList.add("drawer-open");
        drawer.setAttribute("aria-hidden", "false");
      }
      function closeDrawer() {
        isDrawerOpen = false;
        document.body.classList.remove("drawer-open");
        drawer.setAttribute("aria-hidden", "true");
      }

      function openAuthModal(tab = "login") {
        document.getElementById("authModal").classList.add("open");
        switchAuthTab(tab);
      }
      function closeAuthModal() {
        document.getElementById("authModal").classList.remove("open");
      }
      function closeAuthModalOnOverlay(e) {
        if (e.target.id === "authModal") closeAuthModal();
      }

      function openProfileModal() {
        const user = typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() : null;
        const img =
          auth.normalizeDriveProfileImageUrl(localStorage.getItem("boxer_profile_image")) ||
          "./image/cache/1fBykG25zJ2YkJFqY2exc-Lraz0Zzcr18.png";
        document.getElementById("profileName").value = user?.name || "";
        document.getElementById("profilePhone").value = user?.phone || "";
        document.getElementById("profileNickname").value = user?.username || "";
        document.getElementById("profilePassword").value = "";
        document.getElementById("profileError").style.display = "none";
        profilePreview.src = img;
        document.getElementById("profileModal").classList.add("open");
      }
      function closeProfileModal() {
        document.getElementById("profileModal").classList.remove("open");
      }
      function closeProfileModalOnOverlay(e) {
        if (e.target.id === "profileModal") closeProfileModal();
      }

      async function handleProfileSave(e) {
        e.preventDefault();
        const err = document.getElementById("profileError");
        err.style.display = "none";
        try {
          const cu = typeof auth !== "undefined" && auth.getCachedUser ? auth.getCachedUser() || {} : {};
          const mu = {
            ...cu,
            name: document.getElementById("profileName").value.trim(),
            phone: document.getElementById("profilePhone").value.trim(),
            username: document.getElementById("profileNickname").value.trim() || cu.username,
          };
          localStorage.setItem("boxer_user", JSON.stringify(mu));
          closeProfileModal();
          render();
        } catch (ex) {
          err.textContent = ex.message || "프로필 저장에 실패했습니다.";
          err.style.display = "block";
        }
      }

      function performLogout() {
        if (typeof auth !== "undefined" && typeof auth.logout === "function") {
          auth.logout({ redirect: false });
          isLoggedIn = false;
          closeDrawer();
          render();
          return;
        }
        ["boxer_token", "boxer_user", "boxer_logged_in", "boxer_last_activity"].forEach((k) => localStorage.removeItem(k));
        isLoggedIn = false;
        closeDrawer();
        render();
      }

      function switchAuthTab(tab) {
        document.getElementById("tabLogin").setAttribute("aria-selected", tab === "login" ? "true" : "false");
        document.getElementById("tabSignup").setAttribute("aria-selected", tab === "signup" ? "true" : "false");
        document.getElementById("paneLogin").classList.toggle("active", tab === "login");
        document.getElementById("paneSignup").classList.toggle("active", tab === "signup");
        const le = document.getElementById("loginError");
        const se = document.getElementById("signupError");
        if (le) le.style.display = "none";
        if (se) se.style.display = "none";
      }

      function showAuthNotReady(e) {
        e.preventDefault();
        alert("해당 기능은 준비 중입니다.");
        return false;
      }

      async function handleLogin(e) {
        e.preventDefault();
        const err = document.getElementById("loginError");
        err.style.display = "none";
        if (typeof auth === "undefined") {
          err.textContent = "인증 모듈을 불러오지 못했습니다.";
          err.style.display = "block";
          return;
        }
        try {
          let user = await auth.login(document.getElementById("loginEmail").value.trim(), document.getElementById("loginPassword").value);
          if (!user && typeof auth.fetchCurrentUser === "function") user = await auth.fetchCurrentUser();
          isLoggedIn = !!((typeof auth.isLoggedIn === "function" && auth.isLoggedIn()) || user);
          closeAuthModal();
          closeDrawer();
          render();
        } catch (ex) {
          err.textContent = ex.message || "로그인에 실패했습니다.";
          err.style.display = "block";
        }
      }

      async function handleSignup(e) {
        e.preventDefault();
        const err = document.getElementById("signupError");
        err.style.display = "none";
        if (typeof auth === "undefined") {
          err.textContent = "인증 모듈을 불러오지 못했습니다.";
          err.style.display = "block";
          return;
        }
        try {
          const r = await auth.signup(
            document.getElementById("signupUsername").value.trim(),
            document.getElementById("signupEmail").value.trim(),
            document.getElementById("signupPassword").value,
          );
          isLoggedIn = !!((typeof auth.isLoggedIn === "function" && auth.isLoggedIn()) || r?.token || r?.access_token);
          closeAuthModal();
          closeDrawer();
          render();
        } catch (ex) {
          err.textContent = ex.message || "회원가입에 실패했습니다.";
          err.style.display = "block";
        }
      }

      // 레벨 카드 클릭 시 ready.html을 먼저 보여주고, 시작 버튼으로 IM_BOXER lesson 진입
      document.querySelectorAll(".level-card").forEach((card) => {
        const navigateViaReady = () => {
          const selectedLevel = card.getAttribute("data-level") || "beginner";
          const lessonByLevel = {
            beginner: "basic-guard",
            intermediate: "cross",
            advanced: "slip",
          };
          const selectedLesson = lessonByLevel[selectedLevel] || "basic-guard";
          const targetPage = "imboxer/tutorial-lesson.html";
          window.location.href =
            `./ready.html?target=${encodeURIComponent(targetPage)}&level=${encodeURIComponent(selectedLevel)}&lesson=${encodeURIComponent(selectedLesson)}`;
        };

        card.addEventListener("click", navigateViaReady);
        card.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") {
            ev.preventDefault();
            navigateViaReady();
          }
        });
      });

      navLoginBtn.addEventListener("click", () => {
        if (isLoggedIn) {
          window.location.href = "mypage.html";
          return;
        }
        openAuthModal("login");
      });

      profilePhotoInput.addEventListener("change", (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const r = String(reader.result || "");
          localStorage.setItem("boxer_profile_image", r);
          profilePreview.src = r;
        };
        reader.readAsDataURL(file);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && isDrawerOpen) closeDrawer();
      });
      window.addEventListener("storage", (e) => {
        if (["boxer_logged_in", "boxer_user", "boxer_auth_event"].includes(e.key)) initAuthState();
      });

      initAuthState();

      // 1920 기준 디자인을 화면 폭에 맞게 축소(확대는 하지 않음)
      function applyTutorialScale() {
        const designWidth = 1920;
        const scale = Math.min(window.innerWidth / designWidth, 1);
        document.documentElement.style.setProperty("--tut-page-scale", String(scale));
      }
      window.addEventListener("resize", applyTutorialScale);
      applyTutorialScale();
    </script>
    <script src="js/ui/auto-scale.js"></script>
  </body>
</html>
