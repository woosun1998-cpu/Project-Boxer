<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1.0" />
    <title>BOXER - Stretch Play</title>
    <link rel="stylesheet" href="css/global.css" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="js/config/boxer-video-local.js"></script>
    <style>
      @font-face {
        font-family: "Paperlogy Medium";
        src: url("./font/Paperlogy-5Medium.ttf") format("truetype");
      }
      @font-face {
        font-family: "Paperlogy SemiBold";
        src: url("./font/Paperlogy-6SemiBold.ttf") format("truetype");
      }
      @font-face {
        font-family: "KBL Jump";
        src: url("./font/KBLJump_EB_Extended.otf") format("opentype");
      }
      @font-face {
        font-family: "Urban Shadow Sans Serif";
        src: url("./font/Urban Shadow Sans Serif.otf") format("opentype");
      }

      * { box-sizing: border-box; }
      html, body, .stage-viewport {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      body { font-family: "Paperlogy SemiBold", sans-serif; color: #fff; }
      .stage-container { position: relative; width: 1920px; height: 1080px; background: #000; }

      #state-2-training {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #training-left-bg {
        position: absolute;
        left: 0;
        top: 0;
        width: 1380px;
        height: 1080px;
        background: #000;
      }
      #trainer-video {
        position: absolute;
        left: 0;
        top: 0;
        width: 1380px;
        height: 1080px;
        object-fit: contain;
        object-position: center;
        background: #000;
        z-index: 1;
      }

      .stretch-mode-chip {
        position: absolute;
        left: 40px;
        top: 30px;
        z-index: 20;
        display: inline-flex;
        gap: 12px;
        align-items: center;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 999px;
        padding: 10px 16px;
      }
      .stretch-mode-chip strong {
        color: #ed1d32;
        font-size: 18px;
      }
      .stretch-mode-chip span {
        font-size: 14px;
        color: #fff;
        opacity: 0.92;
      }

      .accuracy-gauge-container {
        position: absolute;
        top: 120px;
        right: 590px;
        width: 160px;
        height: 160px;
        background: #111;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        z-index: 12;
      }
      .accuracy-svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
        overflow: visible;
      }
      .accuracy-bg { fill: none; stroke: #333; stroke-width: 8; }
      .accuracy-progress {
        fill: none;
        stroke: #00ffa3;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-dasharray: 440;
        stroke-dashoffset: 440;
        transition: stroke-dashoffset 0.3s ease-out;
      }
      .accuracy-text-wrap { text-align: center; z-index: 2; }
      .accuracy-number { font-family: "KBL Jump", sans-serif; font-size: 55px; color: #00ffa3; }
      .accuracy-percent { font-size: 30px; font-weight: 700; color: #00ffa3; }
      .accuracy-label { margin: 0; font-size: 16px; }

      #state2-right-red, #state2-right-white, #user-cam-box, #feedback-box { z-index: 10; }
      #state2-right-red {
        position: absolute;
        left: 1380px;
        top: 0;
        width: 540px;
        height: 1080px;
        background: #ed1d32;
      }
      #state2-right-white {
        position: absolute;
        left: 1380px;
        top: 0;
        width: 540px;
        height: 674px;
        background: #fff;
      }
      #user-cam-box {
        position: absolute;
        left: 1380px;
        top: 0;
        width: 540px;
        height: 674px;
        overflow: hidden;
      }
      #webcamFeed, #poseCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform: scaleX(-1);
      }
      #webcamFeed { object-fit: cover; }
      #poseCanvas { pointer-events: none; }
      #feedback-box {
        position: absolute;
        left: 1380px;
        top: 694px;
        width: 540px;
        height: 386px;
        padding: 0 0 0 20px;
      }
      #feedback-box h2 {
        margin: 0;
        font-family: "Urban Shadow Sans Serif", sans-serif;
        font-size: 30px;
        letter-spacing: 3px;
      }
      #feedback-msg {
        margin-top: 12px;
        font-size: 22px;
        line-height: 1.4;
      }
      #playlist-status {
        margin-top: 16px;
        font-size: 16px;
        opacity: 0.92;
      }

      .video-controls-wrap {
        position: absolute;
        bottom: 50px;
        left: 50px;
        width: 1280px;
        display: flex;
        align-items: center;
        gap: 20px;
        background: rgba(0, 0, 0, 0.85);
        padding: 15px 30px;
        border-radius: 100px;
        z-index: 99999 !important;
        pointer-events: auto;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .control-btn {
        background: none;
        border: none;
        color: #fff;
        font-size: 28px;
        cursor: pointer;
        min-width: 40px;
      }
      .timeline-slider,
      .volume-slider {
        pointer-events: auto;
        position: relative;
        z-index: 100000;
      }
      .timeline-slider { flex-grow: 1; height: 8px; cursor: pointer; accent-color: #ed1d32; }
      .volume-slider { width: 120px; height: 8px; cursor: pointer; accent-color: #ccff00; }
      #currentTimeDisplay, #durationDisplay { font-size: 16px; min-width: 50px; text-align: center; }
      .volume-icon { font-size: 20px; }
      .jump-time-input {
        width: 74px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        text-align: center;
        font-size: 13px;
      }
      .jump-time-btn {
        height: 30px;
        border: 0;
        border-radius: 8px;
        padding: 0 10px;
        background: #ed1d32;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }

      .summary-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.78);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .summary-content {
        width: 520px;
        background: #171717;
        border: 1px solid #323232;
        border-radius: 20px;
        padding: 32px;
        text-align: center;
      }
      .summary-title { margin: 0 0 18px; color: #ccff00; font-size: 38px; }
      .summary-msg { margin: 0; font-size: 18px; line-height: 1.5; color: #fff; }
      .summary-actions { margin-top: 24px; display: flex; gap: 12px; }
      .btn-summary {
        flex: 1;
        height: 52px;
        border-radius: 10px;
        border: 0;
        cursor: pointer;
        font-size: 18px;
        font-weight: 700;
      }
      .btn-retry { background: #fff; color: #ed1d32; }
      .btn-home { background: #ed1d32; color: #fff; }
    </style>
  </head>
  <body>
    <div class="stage-viewport">
      <div class="stage-container" id="stage-container">
        <div id="state-2-training">
          <div id="training-left-bg"></div>
          <video id="trainer-video" playsinline preload="auto" src=""></video>

          <div class="stretch-mode-chip">
            <strong>재활 운동</strong>
            <span>스트레칭 모드</span>
          </div>

          <div class="accuracy-gauge-container">
            <svg class="accuracy-svg" width="160" height="160" viewBox="0 0 160 160">
              <circle class="accuracy-bg" cx="80" cy="80" r="70"></circle>
              <circle class="accuracy-progress" cx="80" cy="80" r="70"></circle>
            </svg>
            <div class="accuracy-text-wrap">
              <span id="accuracyValue" class="accuracy-number">0</span><span class="accuracy-percent">%</span>
              <p class="accuracy-label">자세 정확도</p>
            </div>
          </div>

          <div id="state2-right-red"></div>
          <div id="state2-right-white"></div>
          <div id="user-cam-box">
            <video id="webcamFeed" autoplay playsinline muted></video>
            <canvas id="poseCanvas"></canvas>
          </div>
          <div id="feedback-box">
            <h2>FEED BACK</h2>
            <div id="feedback-msg">자세 분석 중...</div>
            <div id="playlist-status">재활 스트레칭 준비 중...</div>
          </div>

          <div class="video-controls-wrap">
            <button id="playPauseBtn" class="control-btn">⏸</button>
            <span id="currentTimeDisplay">00:00</span>
            <input type="range" id="videoTimeline" class="timeline-slider" min="0" max="100" value="0" />
            <span id="durationDisplay">00:00</span>
            <input type="text" id="jumpTimeInput" class="jump-time-input" placeholder="mm:ss" />
            <button id="jumpTimeBtn" class="jump-time-btn">이동</button>
            <span class="volume-icon">🔊</span>
            <input type="range" id="videoVolume" class="volume-slider" min="0" max="1" step="0.05" value="0.5" />
          </div>
        </div>
      </div>
    </div>

    <div id="trainingSummaryModal" class="summary-overlay">
      <div class="summary-content">
        <h2 class="summary-title">재활 운동 완료!</h2>
        <p class="summary-msg">재활 스트레칭을 완료했습니다. 아주 좋습니다!</p>
        <div class="summary-actions">
          <button class="btn-summary btn-retry" onclick="retryTraining()">다시하기</button>
          <button class="btn-summary btn-home" onclick="goToHome()">홈으로</button>
        </div>
      </div>
    </div>

    <script>
      function showTrainingSummary() {
        const modal = document.getElementById("trainingSummaryModal");
        if (modal) modal.style.display = "flex";
      }
      function retryTraining() {
        window.location.reload();
      }
      function goToHome() {
        window.location.href = "./stretch.html";
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const trainerVideo = document.getElementById("trainer-video");
        const feedbackMsg = document.getElementById("feedback-msg");
        if (trainerVideo) {
          trainerVideo.addEventListener(
            "error",
            () => {
              if (feedbackMsg) {
                feedbackMsg.textContent =
                  "재활 영상을 불러오지 못했습니다. frontend/video/스트레칭.mp4 파일을 확인해 주세요.";
              }
            },
            { once: true }
          );
        }
        const playPauseBtn = document.getElementById("playPauseBtn");
        const videoTimeline = document.getElementById("videoTimeline");
        const currentTimeDisplay = document.getElementById("currentTimeDisplay");
        const durationDisplay = document.getElementById("durationDisplay");
        const volSlider = document.getElementById("videoVolume");
        const jumpTimeInput = document.getElementById("jumpTimeInput");
        const jumpTimeBtn = document.getElementById("jumpTimeBtn");
        const playlistStatus = document.getElementById("playlist-status");

        const V = window.BOXER_VIDEO || {};
        function buildVideoCandidates(rawPath) {
          const path = String(rawPath || "").trim();
          if (!path) return [];
          const fileName = decodeURIComponent(path.split("/").pop() || "");
          const bases = ["/video/"];
          const apiBase =
            typeof window.__BOXER_API_URL__ === "string" ? window.__BOXER_API_URL__.trim() : "";
          if (apiBase) bases.push(apiBase.replace(/\/$/, "") + "/video/");
          if (/\.trycloudflare\.com$/i.test(window.location.hostname || "")) {
            bases.push(window.location.origin.replace(/\/$/, "") + "/video/");
          }
          const out = [];
          const seen = new Set();
          for (const base of bases) {
            try {
              const url = new URL(base + fileName, window.location.href).href;
              if (!seen.has(url)) {
                seen.add(url);
                out.push(url);
              }
            } catch {
              /* ignore */
            }
          }
          return out;
        }

        const playlist = buildVideoCandidates(V.stretching || "");
        let currentVideoIndex = 0;
        let isDragging = false;

        function formatTime(seconds) {
          const safe = Number(seconds) || 0;
          const m = Math.floor(safe / 60).toString().padStart(2, "0");
          const s = Math.floor(safe % 60).toString().padStart(2, "0");
          return `${m}:${s}`;
        }

        function parseJumpTimeToSeconds(raw) {
          const text = String(raw || "").trim();
          if (!text) return NaN;
          if (text.includes(":")) {
            const [m, s] = text.split(":");
            const mm = Number(m);
            const ss = Number(s);
            if (!Number.isFinite(mm) || !Number.isFinite(ss)) return NaN;
            return mm * 60 + ss;
          }
          const sec = Number(text);
          return Number.isFinite(sec) ? sec : NaN;
        }

        function updatePlaylistStatus() {
          if (playlistStatus) {
            playlistStatus.textContent =
              playlist.length > 0 ? "재활 스트레칭 재생 중" : "재활 영상 경로 없음";
          }
        }

        async function loadAndPlay(index) {
          if (!trainerVideo) return;
          if (!playlist.length) {
            if (feedbackMsg) {
              feedbackMsg.textContent =
                "재활 영상을 불러오지 못했습니다. frontend/video/스트레칭.mp4 파일을 확인해 주세요.";
            }
            return;
          }
          currentVideoIndex = index;
          trainerVideo.src = playlist[currentVideoIndex];
          updatePlaylistStatus();
          try {
            await trainerVideo.play();
            if (playPauseBtn) playPauseBtn.textContent = "⏸";
          } catch {
            trainerVideo.muted = true;
            await trainerVideo.play().catch(() => {});
            if (playPauseBtn) playPauseBtn.textContent = "⏸";
          }
        }

        if (trainerVideo && videoTimeline) {
          trainerVideo.addEventListener("error", async () => {
            const next = currentVideoIndex + 1;
            if (next < playlist.length) {
              await loadAndPlay(next);
              return;
            }
            if (feedbackMsg) {
              feedbackMsg.textContent =
                "재활 영상을 찾지 못했습니다. /video 또는 API_URL/video 경로를 확인해 주세요.";
            }
          });
          trainerVideo.addEventListener("loadedmetadata", () => {
            if (durationDisplay) durationDisplay.textContent = formatTime(trainerVideo.duration);
            videoTimeline.max = Math.floor(trainerVideo.duration || 0);
          });
          videoTimeline.addEventListener("mousedown", () => (isDragging = true));
          videoTimeline.addEventListener("touchstart", () => (isDragging = true));
          videoTimeline.addEventListener("mouseup", () => (isDragging = false));
          videoTimeline.addEventListener("touchend", () => (isDragging = false));
          videoTimeline.addEventListener("input", (e) => {
            trainerVideo.currentTime = Number(e.target.value || 0);
            if (currentTimeDisplay) currentTimeDisplay.textContent = formatTime(e.target.value);
          });
          trainerVideo.addEventListener("timeupdate", () => {
            if (currentTimeDisplay && !isDragging) {
              currentTimeDisplay.textContent = formatTime(trainerVideo.currentTime);
            }
            if (!isDragging) {
              videoTimeline.value = Math.floor(trainerVideo.currentTime || 0);
            }
          });

          // 무엇: 영상 하나가 끝나면 다음 영상으로 자동 이동한다.
          // 왜: 1→2→3 재활 루틴을 끊김 없이 연속 재생하기 위해.
          trainerVideo.addEventListener("ended", async () => {
            const next = currentVideoIndex + 1;
            if (next < playlist.length) {
              await loadAndPlay(next);
              return;
            }
            showTrainingSummary();
          });
        }

        if (volSlider && trainerVideo) {
          trainerVideo.volume = Number(volSlider.value || 0.5);
          trainerVideo.muted = trainerVideo.volume === 0;
          volSlider.addEventListener("input", (e) => {
            trainerVideo.volume = Number(e.target.value || 0);
            trainerVideo.muted = Number(e.target.value || 0) === 0;
          });
        }

        if (playPauseBtn && trainerVideo) {
          playPauseBtn.addEventListener("click", () => {
            if (trainerVideo.paused) {
              trainerVideo.play().catch(() => {});
              playPauseBtn.textContent = "⏸";
            } else {
              trainerVideo.pause();
              playPauseBtn.textContent = "▶";
            }
          });
        }

        if (jumpTimeBtn && jumpTimeInput && trainerVideo && videoTimeline) {
          const jumpNow = () => {
            const targetSec = parseJumpTimeToSeconds(jumpTimeInput.value);
            if (!Number.isFinite(targetSec)) return;
            const max = Number(trainerVideo.duration || 0);
            const clamped = Math.max(0, Math.min(targetSec, max));
            trainerVideo.currentTime = clamped;
            if (currentTimeDisplay) currentTimeDisplay.textContent = formatTime(clamped);
            videoTimeline.value = Math.floor(clamped);
          };
          jumpTimeBtn.addEventListener("click", jumpNow);
          jumpTimeInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") jumpNow();
          });
        }

        try {
          await window.initPoseTracking?.({
            videoId: "webcamFeed",
            canvasId: "poseCanvas",
          });
        } catch {
          const msgEl = document.getElementById("feedback-msg");
          if (msgEl) msgEl.innerText = "웹캠 권한을 허용해주세요!";
        }

        if (!playlist.length && feedbackMsg) {
          feedbackMsg.textContent =
            "재활 영상을 찾지 못했습니다. /video 또는 API_URL/video 경로를 확인해 주세요.";
          return;
        }
        await loadAndPlay(0);
      });
    </script>
    <script src="js/core/pose.js"></script>
    <script src="/js/core/obstacle-detect.js?v=20260527-engine-pause"></script>
    <script src="js/ui/auto-scale.js"></script>
  </body>
</html>
