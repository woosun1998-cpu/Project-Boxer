<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8000D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8000D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="70" r="48" fill="url(#glow)"/>
  <!-- Head (leaning back - bad) -->
  <circle cx="46" cy="16" r="10" stroke="white" stroke-width="2.5" fill="rgba(255,255,255,0.07)"/>
  <!-- Torso (leaning back - bad) -->
  <line x1="46" y1="26" x2="52" y2="80" stroke="#E8000D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Error on torso lean -->
  <line x1="44" y1="44" x2="50" y2="44" stroke="#FFE500" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <polyline points="44,41 40,44 44,47" stroke="#FFE500" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Shoulders -->
  <line x1="30" y1="40" x2="70" y2="36" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm: dropped (bad - guard broken) -->
  <polyline points="30,40 22,62 20,72" stroke="#E8000D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="72" r="5" fill="#E8000D"/>
  <!-- Error on left arm drop -->
  <line x1="20" y1="58" x2="20" y2="68" stroke="#FFE500" stroke-width="2" stroke-linecap="round"/>
  <polyline points="17,66 20,70 23,66" stroke="#FFE500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm: big wind-up (bad - arm too far back) -->
  <line x1="70" y1="36" x2="84" y2="48" stroke="#E8000D" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="48" x2="74" y2="22" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="74" cy="20" r="5.5" fill="rgba(255,255,255,0.3)"/>
  <!-- Hips -->
  <line x1="36" y1="80" x2="64" y2="80" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <polyline points="36,80 32,106 34,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="34" y1="128" x2="24" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="64,80 68,106 66,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="66" y1="128" x2="76" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bad indicator -->
  <circle cx="88" cy="14" r="8" fill="#E8000D" opacity="0.9"/>
  <line x1="84" y1="10" x2="92" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="10" x2="84" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
