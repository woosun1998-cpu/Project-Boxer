<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8000D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8000D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="70" r="48" fill="url(#glow)"/>
  <!-- Head -->
  <circle cx="50" cy="12" r="10" stroke="white" stroke-width="2.5" fill="rgba(255,255,255,0.07)"/>
  <!-- Torso -->
  <line x1="50" y1="22" x2="52" y2="76" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <line x1="28" y1="32" x2="70" y2="38" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm: WIDE SWING (arm too extended, like a haymaker - bad) -->
  <line x1="28" y1="32" x2="6" y2="26" stroke="#E8000D" stroke-width="3" stroke-linecap="round"/>
  <line x1="6" y1="26" x2="4" y2="42" stroke="#E8000D" stroke-width="3" stroke-linecap="round"/>
  <circle cx="4" cy="43" r="5.5" fill="#E8000D"/>
  <!-- Error: X on the wide swing -->
  <line x1="10" y1="30" x2="16" y2="36" stroke="#FFE500" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="10" y2="36" stroke="#FFE500" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Right arm: guard maintained -->
  <polyline points="70,38 78,56 73,40" stroke="rgba(255,255,255,0.6)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="73" cy="39" r="5" fill="rgba(255,255,255,0.5)"/>
  <!-- Hips -->
  <line x1="36" y1="76" x2="66" y2="74" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left leg -->
  <polyline points="36,76 30,103 32,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="128" x2="22" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <polyline points="66,74 72,101 70,127" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="70" y1="127" x2="80" y2="131" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bad indicator -->
  <circle cx="88" cy="14" r="8" fill="#E8000D" opacity="0.9"/>
  <line x1="84" y1="10" x2="92" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="10" x2="84" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
