<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8000D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8000D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="70" r="48" fill="url(#glow)"/>
  <!-- Head -->
  <circle cx="52" cy="13" r="10" stroke="white" stroke-width="2.5" fill="rgba(255,255,255,0.07)"/>
  <!-- Torso -->
  <line x1="52" y1="23" x2="50" y2="75" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <line x1="30" y1="36" x2="70" y2="36" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm extended (jab) -->
  <line x1="30" y1="36" x2="8" y2="34" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="7" cy="34" r="5.5" fill="rgba(255,255,255,0.4)"/>
  <!-- Right arm: DROPPED (bad - guard not maintained) -->
  <polyline points="70,36 78,60 75,68" stroke="#E8000D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="75" cy="68" r="5" fill="#E8000D"/>
  <!-- Error: down arrow on right fist -->
  <line x1="75" y1="52" x2="75" y2="62" stroke="#FFE500" stroke-width="2" stroke-linecap="round"/>
  <polyline points="72,60 75,64 78,60" stroke="#FFE500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Hips -->
  <line x1="36" y1="75" x2="64" y2="75" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left leg -->
  <polyline points="36,75 30,102 32,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="128" x2="22" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <polyline points="64,75 70,102 68,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="68" y1="128" x2="78" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bad indicator -->
  <circle cx="88" cy="14" r="8" fill="#E8000D" opacity="0.9"/>
  <line x1="84" y1="10" x2="92" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="10" x2="84" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
