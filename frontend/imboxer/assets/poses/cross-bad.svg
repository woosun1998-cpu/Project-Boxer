<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8000D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8000D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="70" r="48" fill="url(#glow)"/>
  <!-- Head (over-extended, leaning too forward) -->
  <circle cx="58" cy="16" r="10" stroke="white" stroke-width="2.5" fill="rgba(255,255,255,0.07)"/>
  <!-- Torso (over-leaning forward - bad) -->
  <line x1="58" y1="26" x2="46" y2="76" stroke="#E8000D" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulders -->
  <line x1="36" y1="40" x2="74" y2="28" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm: dropped (bad) -->
  <polyline points="36,40 30,62 28,70" stroke="#E8000D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="70" r="5" fill="#E8000D"/>
  <!-- Error on left (guard dropped) -->
  <line x1="28" y1="56" x2="28" y2="66" stroke="#FFE500" stroke-width="2" stroke-linecap="round"/>
  <polyline points="25,64 28,68 31,64" stroke="#FFE500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm extended -->
  <line x1="74" y1="28" x2="94" y2="24" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="95" cy="24" r="5.5" fill="rgba(255,255,255,0.4)"/>
  <!-- Hips -->
  <line x1="34" y1="78" x2="62" y2="72" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left leg -->
  <polyline points="34,78 28,104 30,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30" y1="128" x2="20" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <polyline points="62,72 68,100 66,126" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="66" y1="126" x2="76" y2="130" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bad indicator -->
  <circle cx="88" cy="14" r="8" fill="#E8000D" opacity="0.9"/>
  <line x1="84" y1="10" x2="92" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="10" x2="84" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
