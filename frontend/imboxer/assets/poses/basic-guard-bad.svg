<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8000D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8000D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="70" r="48" fill="url(#glow)"/>
  <!-- Head -->
  <circle cx="50" cy="12" r="10" stroke="white" stroke-width="2.5" fill="rgba(255,255,255,0.07)"/>
  <!-- Neck + Torso -->
  <line x1="50" y1="22" x2="50" y2="75" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulders (one dropped) -->
  <line x1="28" y1="35" x2="72" y2="40" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left arm: fist dropped LOW (bad - below chin) -->
  <polyline points="28,35 20,54 18,60" stroke="#E8000D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="18" cy="60" r="5" fill="#E8000D"/>
  <!-- Error arrow pointing down on left fist -->
  <line x1="18" y1="48" x2="18" y2="56" stroke="#FFE500" stroke-width="2" stroke-linecap="round"/>
  <polyline points="15,54 18,58 21,54" stroke="#FFE500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right arm: guard still up -->
  <polyline points="72,40 80,58 75,42" stroke="rgba(255,255,255,0.5)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="75" cy="41" r="5" fill="rgba(255,255,255,0.4)"/>
  <!-- Hips -->
  <line x1="36" y1="75" x2="64" y2="75" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
  <!-- Left leg -->
  <polyline points="36,75 30,102 32,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="32" y1="128" x2="22" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <polyline points="64,75 70,102 68,128" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="68" y1="128" x2="78" y2="132" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bad indicator -->
  <circle cx="88" cy="14" r="8" fill="#E8000D" opacity="0.9"/>
  <line x1="84" y1="10" x2="92" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="10" x2="84" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
