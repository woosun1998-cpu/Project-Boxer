version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: boxer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: boxer_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - boxer-db-data:/var/lib/mysql
      - ../app/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../app/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: boxer-api
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  boxer-db-data:
